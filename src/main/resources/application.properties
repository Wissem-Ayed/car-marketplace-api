spring.application.name=car-marketplace-api
server.port=8050
spring.mvc.problemdetails.enabled=true
spring.data.web.pageable.max-page-size=100
spring.data.mongodb.auto-index-creation=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=101MB
springdoc.override-with-generic-response=false
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.display-request-duration=true
springdoc.default-produces-media-type=application/json
springdoc.swagger-ui.oauth.client-id=car-marketplace-web
springdoc.swagger-ui.oauth.use-pkce-with-authorization-code-grant=true
springdoc.swagger-ui.persist-authorization=true
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/car-marketplace
spring.security.oauth2.resourceserver.jwt.audiences=car-marketplace-api
app.cors.allowed-origins=http://localhost:3000
app.storage.endpoint=http://localhost:8333
app.storage.region=us-east-1
app.storage.access-key=car-marketplace
app.storage.secret-key=car-marketplace-secret
app.storage.bucket=car-photos
app.storage.public-url=http://localhost:8333/car-photos
