services:
  mongodb:
    image: 'mongo:8.0'
    environment:
      - 'MONGO_INITDB_DATABASE=car_marketplace'
      - 'MONGO_INITDB_ROOT_USERNAME=root'
      - 'MONGO_INITDB_ROOT_PASSWORD=secret'
    ports:
      - '27018:27017'
    volumes:
      - 'mongo-data:/data/db'

  seaweedfs:
    image: 'chrislusf/seaweedfs:4.47'
    command: 'server -dir=/data -s3 -s3.config=/etc/seaweedfs/s3.json'
    ports:
      - '8333:8333'
      - '8888:8888'
    volumes:
      - 'seaweed-data:/data'
      - './docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro'
    healthcheck:
      test: ['CMD-SHELL', "wget -q -S -O /dev/null http://127.0.0.1:8333/ 2>&1 | grep -q 'HTTP/1.1'"]
      interval: 2s
      timeout: 2s
      retries: 30

  keycloak:
    image: 'quay.io/keycloak/keycloak:26.7.4'
    command: 'start-dev --import-realm --http-port=8180'
    environment:
      - 'KC_BOOTSTRAP_ADMIN_USERNAME=admin'
      - 'KC_BOOTSTRAP_ADMIN_PASSWORD=admin'
      - 'KC_HEALTH_ENABLED=true'
    ports:
      - '8180:8180'
    volumes:
      - './docker/keycloak/car-marketplace-realm.json:/opt/keycloak/data/import/car-marketplace-realm.json:ro'
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q UP <&3"]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      - mailpit

  mailpit:
    image: 'axllent/mailpit:v1.31.2'
    ports:
      - '8025:8025'
      - '1025:1025'

volumes:
  mongo-data:
  seaweed-data:
